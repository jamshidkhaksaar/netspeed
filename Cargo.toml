[package]
name = "netspeed"
version = "1.0.1"
edition = "2024"
description = "Taskbar network speed widget for Windows 11 - native Rust, Direct2D, no Electron"
license = "MIT"
repository = "https://github.com/jamshidkhaksaar/netspeed"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "std",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
